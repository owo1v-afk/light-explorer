name: build apk

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: install gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.7/bin" >> $GITHUB_PATH

      - name: setup sdk packages
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true
          yes | sdkmanager --licenses || true

      - name: build debug apk
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: upload apk
        uses: actions/upload-artifact@v4
        with:
          name: explorer-debug
          path: app/build/outputs/apk/debug/*.apk
